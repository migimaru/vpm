<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VCCに追加</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #5865f2;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <h1>VCCに追加</h1>

  <p>VRChat Creator Companion を開いています。</p>

  <p>
    自動的に開かない場合は、下のボタンを押してください。
  </p>

  <a id="open-vcc" href="#">
    VCCで開く
  </a>

  <script>
    const repoUrl = "https://migimaru.github.io/vpm/index.json";

    const vccUrl =
      `vcc://vpm/addRepo?url=${encodeURIComponent(repoUrl)}`;

    document.getElementById("open-vcc").href = vccUrl;

    window.location.href = vccUrl;
  </script>
</body>
</html>
